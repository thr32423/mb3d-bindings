[package]
name = "mb3d-node"
version = "0.2.0"
edition = "2021"
description = "mb3d-rs as a Node.js add-on: 3D fractals of Mandelbulb3D"
license = "LGPL-2.1-only"
publish = false

[lib]
name = "mb3d_node"
crate-type = ["cdylib"]

[dependencies]
# The engine, without its desktop application.
engine = { package = "mb3d", git = "https://github.com/thr32423/mb3d-rs", tag = "v0.3.10", default-features = false, features = ["gpu", "jit", "oidn"] }
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

# (as the engine is built)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
