<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mb3d explorer</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --line: #30343c; --text: #e6e8eb; --dim: #9aa1ab; --accent: #6cb4ff;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f3f4f6; --panel: #ffffff; --line: #d5d8dd; --text: #1b1e23; --dim: #5d6570; --accent: #1766c2; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 16px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 12px; }
  #view { position: relative; background: #000; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; touch-action: none; cursor: grab; }
  #view.drag { cursor: grabbing; }
  #picture { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
  #status { color: var(--dim); margin: 8px 2px 0; min-height: 1.45em; }
  #status.error { color: #e2685f; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; margin-bottom: 12px; }
  .panel h2 { font-size: 13px; margin: 0 0 8px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  label.row { display: grid; grid-template-columns: 84px minmax(0, 1fr) 56px; gap: 8px; align-items: center; margin: 6px 0; }
  label.row output { text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select, button, textarea, input[type=number] { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; }
  select { width: 100%; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  textarea { width: 100%; height: 150px; font: 12px/1.4 ui-monospace, monospace; resize: vertical; }
  pre { margin: 0; font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
  progress { width: 100%; height: 8px; margin-top: 8px; accent-color: var(--accent); }
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tabs button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<main>
  <section>
    <h1>mb3d explorer</h1>
    <p class="sub">Drag to turn, wheel to zoom. Every picture is calculated by the mb3d engine behind this page.</p>
    <div id="view"><img id="picture" alt="The fractal as calculated" width="800" height="600"></div>
    <p id="status" role="status">Starting…</p>
  </section>
  <aside>
    <div class="panel">
      <h2>Scene</h2>
      <select id="formula" aria-label="Formula"></select>
      <div class="buttons" style="margin-top:8px">
        <button id="openButton" type="button">Open a parameter file…</button>
        <input id="file" type="file" accept=".m3p,.m3i,.m3s,.txt" hidden>
      </div>
    </div>
    <div class="panel">
      <h2>View</h2>
      <label class="row">Turn X <input id="rx" type="range" min="-180" max="180" step="0.1"><output></output></label>
      <label class="row">Turn Y <input id="ry" type="range" min="-180" max="180" step="0.1"><output></output></label>
      <label class="row">Turn Z <input id="rz" type="range" min="-180" max="180" step="0.1"><output></output></label>
      <label class="row">Zoom <input id="zoom" type="range" min="-3" max="4" step="0.01"><output></output></label>
      <label class="row">View angle <input id="fov" type="range" min="5" max="120" step="1"><output></output></label>
      <label class="row">Iterations <input id="iterations" type="range" min="1" max="60" step="1"><output></output></label>
    </div>
    <div class="panel">
      <h2>Save</h2>
      <div class="buttons">
        <label>Width <input id="saveWidth" type="number" min="64" max="8192" step="16" value="1920" style="width:84px"></label>
        <button id="savePng" type="button">Picture (.png)</button>
        <button id="saveM3p" type="button">Parameters (.m3p)</button>
      </div>
      <progress id="progress" max="1" value="0" hidden></progress>
    </div>
    <div class="panel">
      <h2>The same in code</h2>
      <div class="tabs">
        <button type="button" data-lang="python" aria-pressed="true">Python</button>
        <button type="button" data-lang="js" aria-pressed="false">JavaScript</button>
      </div>
      <pre id="code"></pre>
    </div>
    <details class="panel">
      <summary>Scene text</summary>
      <textarea id="text" spellcheck="false" aria-label="Scene text"></textarea>
      <div class="buttons" style="margin-top:8px"><button id="applyText" type="button">Apply</button></div>
    </details>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const sliders = ["rx", "ry", "rz", "zoom", "fov", "iterations"];
const state = { opened: 'preset("Amazing Box")', changes: {}, rotation: [0, 0, 0] };
let lang = "python", seq = 0, busy = 0, refine = 0, pictureUrl = "";

function status(text, error) {
  $("status").textContent = text;
  $("status").classList.toggle("error", !!error);
}

async function api(path, body) {
  const r = await fetch("api/" + path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r;
}

// a global key of the scene text
function key(text, name) {
  for (const line of text.split("\n")) {
    if (line.startsWith("[")) break;
    const i = line.indexOf("=");
    if (i > 0 && line.slice(0, i).trim() === name) return line.slice(i + 1).trim();
  }
}

function show() {
  for (const id of sliders) {
    const v = Number($(id).value);
    $(id).nextElementSibling.textContent = id === "zoom" ? (2 ** v).toPrecision(3) : id.startsWith("r") ? Math.round(v) + "°" : id === "fov" ? v + "°" : v;
  }
  const c = state.changes, py = [], js = [];
  for (const [k, v] of Object.entries(c)) {
    py.push(`${k}=${Array.isArray(v) ? "(" + v.join(", ") + ")" : v}`);
    js.push(`${k}: ${Array.isArray(v) ? "[" + v.join(", ") + "]" : v}`);
  }
  const w = $("saveWidth").value;
  $("code").textContent = lang === "python"
    ? `import mb3d\n\nwith mb3d.Engine() as engine:\n    scene = engine.${state.opened}\n` + (py.length ? `    scene.set(${py.join(", ")})\n` : "") + `    scene.render(width=${w}, file="picture.png")`
    : `import { Engine } from "mb3d";\n\nconst engine = await Engine.start();\nconst scene = await engine.${state.opened};\n` + (js.length ? `await scene.set({ ${js.join(", ")} });\n` : "") + `await scene.render({ width: ${w}, file: "picture.png" });\nengine.close();`;
}

// the sliders follow the scene the engine holds
function follow(about) {
  state.rotation = about.rotation || [0, 0, 0];
  [$("rx").value, $("ry").value, $("rz").value] = state.rotation;
  const zoom = Number(key(about.text, "zoom")) || 1;
  $("zoom").value = Math.log2(zoom);
  $("fov").value = Number(key(about.text, "fov")) || 30;
  $("iterations").value = Number(key(about.text, "iterations")) || 12;
  $("text").value = about.text;
  $("picture").width = about.width;
  $("picture").height = about.height;
  show();
}

// what a slider says, as a change of the scene (only what was touched is
// sent: the rest of the scene stays as the file had it)
function change(id) {
  if (id.startsWith("r")) return { rotation: ["rx", "ry", "rz"].map((a) => Number($(a).value)) };
  if (id === "zoom") return { zoom: Number((2 ** Number($("zoom").value)).toPrecision(6)) };
  return { [id]: Number($(id).value) };
}

const lines = (c) => Object.entries(c).map(([k, v]) => `${k} = ${Array.isArray(v) ? v.join(", ") : v}`).join("\n");

// a quick picture now, a sharp one when the hand rests
async function render(width) {
  const mine = ++seq;
  clearTimeout(refine);
  busy++;
  try {
    // every request carries all the changes made so far, so the newest one
    // alone says what the scene is: one that arrives late can be dropped
    const body = { width, seq: mine };
    if (Object.keys(state.changes).length) body.changes = lines(state.changes);
    const r = await api("render", body);
    const blob = await r.blob();
    if (mine !== seq) return;
    URL.revokeObjectURL(pictureUrl);
    pictureUrl = URL.createObjectURL(blob);
    $("picture").src = pictureUrl;
    status(`${r.headers.get("X-Width")} × ${r.headers.get("X-Height")} in ${r.headers.get("X-Seconds")} s — ${r.headers.get("X-Device")}`);
    const full = Math.min(1600, Math.round($("view").clientWidth * Math.min(devicePixelRatio || 1, 2) / 16) * 16);
    if (width < full) refine = setTimeout(() => render(full), 250);
  } catch (e) {
    if (mine === seq && e.message !== "cancelled") status(e.message, true);
  } finally {
    busy--;
  }
}

function changedNow(id) {
  Object.assign(state.changes, change(id));
  show();
  render(400);
}

async function open(body, opened) {
  status("Opening…");
  try {
    const about = await (await api("open", body)).json();
    seq = 0;
    state.opened = opened;
    state.changes = {};
    follow(about);
    if (about.notes.length) console.info(about.notes.join("\n"));
    render(400);
  } catch (e) {
    status(e.message, true);
  }
}

for (const id of sliders) $(id).addEventListener("input", () => changedNow(id));
$("saveWidth").addEventListener("input", show);
$("formula").addEventListener("change", () => open({ preset: $("formula").value }, `preset(${JSON.stringify($("formula").value)})`));
$("openButton").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", async () => {
  const f = $("file").files[0];
  if (!f) return;
  const bytes = new Uint8Array(await f.arrayBuffer());
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  await open({ name: f.name, data: btoa(bin) }, `open(${JSON.stringify(f.name)})`);
  $("file").value = "";
});
$("applyText").addEventListener("click", () => open({ text: $("text").value }, lang === "python" ? "from_text(text)" : "fromText(text)"));
for (const b of document.querySelectorAll(".tabs button")) {
  b.addEventListener("click", () => {
    lang = b.dataset.lang;
    for (const o of document.querySelectorAll(".tabs button")) o.setAttribute("aria-pressed", o === b);
    show();
  });
}

// drag to turn, wheel to zoom
const view = $("view");
let drag = null;
view.addEventListener("pointerdown", (e) => {
  drag = { x: e.clientX, y: e.clientY, rx: Number($("rx").value), ry: Number($("ry").value) };
  view.setPointerCapture(e.pointerId);
  view.classList.add("drag");
});
view.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const wrap = (v) => ((v + 180) % 360 + 360) % 360 - 180;
  $("ry").value = wrap(drag.ry + (e.clientX - drag.x) * 0.4);
  $("rx").value = wrap(drag.rx - (e.clientY - drag.y) * 0.4);
  changedNow("rx");
});
for (const ev of ["pointerup", "pointercancel"]) view.addEventListener(ev, () => { drag = null; view.classList.remove("drag"); });
view.addEventListener("wheel", (e) => {
  e.preventDefault();
  $("zoom").value = Number($("zoom").value) - Math.sign(e.deltaY) * 0.1;
  changedNow("zoom");
}, { passive: false });

function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

$("savePng").addEventListener("click", async () => {
  const bar = $("progress");
  bar.hidden = false;
  bar.value = 0;
  const mine = ++seq; // pictures on their way are not shown over this one
  clearTimeout(refine);
  const poll = setInterval(async () => {
    const p = await (await api("progress")).json().catch(() => null);
    if (p && p.total) {
      bar.value = p.done / p.total;
      status(`${p.stage || "calculating"} ${Math.round(100 * p.done / p.total)} %`);
    }
  }, 200);
  try {
    const r = await api("render", { width: Number($("saveWidth").value), progress: true, seq: mine });
    download(await r.blob(), "picture.png");
    status(`Saved ${r.headers.get("X-Width")} × ${r.headers.get("X-Height")} in ${r.headers.get("X-Seconds")} s — ${r.headers.get("X-Device")}`);
  } catch (e) {
    status(e.message, true);
  } finally {
    clearInterval(poll);
    bar.hidden = true;
  }
});
$("saveM3p").addEventListener("click", async () => download(await (await api("m3p")).blob(), "scene.m3p"));

(async () => {
  try {
    const info = await (await api("info")).json();
    for (const n of info.formulas) $("formula").add(new Option(n, n));
    $("formula").value = "Amazing Box";
    document.title = `mb3d explorer (${info.version})`;
    await open({ preset: "Amazing Box" }, 'preset("Amazing Box")');
  } catch (e) {
    status(e.message, true);
  }
})();
</script>
</body>
</html>
