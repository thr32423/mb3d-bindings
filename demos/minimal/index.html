<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mb3d: one picture</title>
<style>
  body { margin: 24px auto; max-width: 680px; padding: 0 16px; font: 15px/1.5 system-ui, sans-serif; color-scheme: light dark; }
  img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; background: #000; border-radius: 6px; }
  form { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  select, input { font: inherit; }
</style>
</head>
<body>
<h1>One fractal picture</h1>
<form id="form">
  <label>Formula
    <select name="formula">
      <option>Amazing Box</option>
      <option>Integer Power</option>
      <option>Quaternion</option>
      <option>Bulbox</option>
    </select>
  </label>
  <label>Zoom <input name="zoom" type="range" min="0.1" max="1.5" step="0.01" value="0.17"></label>
</form>
<img id="picture" alt="The fractal as calculated">
<script>
  const form = document.getElementById("form");
  const show = () => {
    document.getElementById("picture").src = "/fractal.png?width=640&" + new URLSearchParams(new FormData(form));
  };
  form.addEventListener("change", show);
  show();
</script>
</body>
</html>
